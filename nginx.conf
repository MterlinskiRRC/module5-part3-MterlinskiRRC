# Reverse proxy for Pixel River Financial Bank Services (Part 3)
events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name localhost;

        # 1) Transactions microservice (JavaScript) - entry point:
        #    /api/transactions/<userId>  -> Express service on :3000
        #    Regex match is checked before the generic /api/ prefix below.
        location ~ ^/api/transactions/[^/]+$ {
            set $transactions_upstream http://transactions:3000;
            proxy_pass $transactions_upstream;      # path forwarded unchanged
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2) Banking backend (Flask): register, login, dashboard, deposit,
        #    withdraw, logout and the session-based /api/transactions report
        location /api/ {
            set $backend_upstream http://backend:5000;
            proxy_pass $backend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3) Everything else -> static student portfolio
        location / {
            set $frontend_upstream http://frontend:80;
            proxy_pass $frontend_upstream;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
        }
    }
}
